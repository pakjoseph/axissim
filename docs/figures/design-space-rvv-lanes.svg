<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">AxisSim modeled latency by RVV lane count</title><desc id="desc">At 20 gigabytes per second DRAM bandwidth, modeled latency falls from 2010.36 microseconds at 2 lanes to 669.51 microseconds at 16 lanes.</desc>
<style>@media (prefers-color-scheme: dark) { rect { fill: #0d1117 !important; } text { fill: #c9d1d9 !important; } g[stroke] line { stroke: #30363d !important; } line[stroke="#374151"] { stroke: #8b949e !important; } }</style><rect width="760" height="390" fill="#fff"/><g font-family="Arial,sans-serif" fill="#1f2937"><text x="70" y="34" font-size="20" font-weight="600">Physical AI baseline: RVV lanes at 20 GB/s DRAM</text><text x="70" y="56" font-size="13" fill="#4b5563">Modeled latency; fixed workload and NPU mapping</text><g stroke="#d1d5db"><line x1="90" y1="92" x2="720" y2="92"/><line x1="90" y1="157" x2="720" y2="157"/><line x1="90" y1="222" x2="720" y2="222"/><line x1="90" y1="287" x2="720" y2="287"/></g><g font-size="12" fill="#4b5563"><text x="32" y="96">2,100</text><text x="32" y="161">1,400</text><text x="45" y="226">700</text><text x="58" y="291">0</text></g><line x1="90" y1="287" x2="720" y2="287" stroke="#374151"/><polyline fill="none" stroke="#2563eb" stroke-width="3" points="120,100 310,171 500,207 690,225"/><g fill="#2563eb"><circle cx="120" cy="100" r="5"/><circle cx="310" cy="171" r="5"/><circle cx="500" cy="207" r="5"/><circle cx="690" cy="225" r="5"/></g><g font-size="13"><text x="112" y="315">2 lanes</text><text x="302" y="315">4 lanes</text><text x="492" y="315">8 lanes</text><text x="678" y="315">16 lanes</text></g><g font-size="12" fill="#1f2937"><text x="100" y="87">2,010</text><text x="290" y="158">1,244</text><text x="482" y="194">861</text><text x="672" y="212">670 µs</text></g></g>
