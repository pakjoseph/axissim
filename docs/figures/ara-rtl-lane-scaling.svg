<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Ara RTL and AxisSim cycle scaling by vector lane count</title>
  <desc id="desc">Line chart comparing raw Ara RTL cycles with AxisSim compute-envelope cycles for 2, 4, 8, and 16 lanes.</desc>
  <style>@media (prefers-color-scheme: dark) { rect { fill: #0d1117 !important; } text { fill: #c9d1d9 !important; } g[stroke] line { stroke: #30363d !important; } line[stroke="#374151"] { stroke: #8b949e !important; } }</style>
  <rect width="760" height="420" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="70" y="35" font-size="20" font-weight="600">Ara FP64 fmatmul 128³: RTL vs. compute envelope</text>
    <text x="70" y="58" font-size="13" fill="#4b5563">Raw hardware cycles; lower is better</text>
    <g stroke="#d1d5db" stroke-width="1">
      <line x1="90" y1="90" x2="720" y2="90"/><line x1="90" y1="155" x2="720" y2="155"/><line x1="90" y1="220" x2="720" y2="220"/><line x1="90" y1="285" x2="720" y2="285"/><line x1="90" y1="350" x2="720" y2="350"/>
    </g>
    <g font-size="12" fill="#4b5563"><text x="20" y="354">0</text><text x="10" y="289">0.3M</text><text x="10" y="224">0.6M</text><text x="10" y="159">0.9M</text><text x="4" y="94">1.2M</text></g>
    <line x1="90" y1="350" x2="720" y2="350" stroke="#374151" stroke-width="1.5"/>
    <polyline fill="none" stroke="#2563eb" stroke-width="3" points="120,119 310,235 500,290 690,313"/>
    <polyline fill="none" stroke="#f97316" stroke-width="3" points="120,123 310,236 500,293 690,322"/>
    <g fill="#2563eb"><circle cx="120" cy="119" r="5"/><circle cx="310" cy="235" r="5"/><circle cx="500" cy="290" r="5"/><circle cx="690" cy="313" r="5"/></g>
    <g fill="#f97316"><circle cx="120" cy="123" r="5"/><circle cx="310" cy="236" r="5"/><circle cx="500" cy="293" r="5"/><circle cx="690" cy="322" r="5"/></g>
    <g font-size="13"><text x="112" y="375">2 lanes</text><text x="302" y="375">4 lanes</text><text x="492" y="375">8 lanes</text><text x="678" y="375">16 lanes</text></g>
    <g font-size="13"><line x1="500" y1="70" x2="525" y2="70" stroke="#2563eb" stroke-width="3"/><text x="532" y="75">Ara RTL</text><line x1="625" y1="70" x2="650" y2="70" stroke="#f97316" stroke-width="3"/><text x="657" y="75">AxisSim</text></g>
  </g>
</svg>
