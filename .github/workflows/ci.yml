name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} ${{ matrix.gui == 'true' && 'desktop' || 'core' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gui: 'true'
            full_test: 'true'
          - os: windows-latest
            gui: 'true'
            full_test: 'false'
          - os: macos-latest
            gui: 'false'
            full_test: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends qt6-base-dev
      - name: Install Qt on Windows
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAXISSIM_BUILD_GUI=${{ matrix.gui == 'true' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel
      - name: Run full regression suite
        if: matrix.full_test == 'true'
        run: ctest --test-dir build --output-on-failure
      - name: Run desktop smoke suite
        if: matrix.gui == 'true'
        run: ctest --test-dir build --output-on-failure -R "desktop_gui_(initializes|runs_model|portable_layout_runs_model)"
