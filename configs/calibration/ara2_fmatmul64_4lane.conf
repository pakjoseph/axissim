rvv_lmul = 1
rvv_lanes = 4
rvv_ops_per_lane_cycle = 2
rvv_frequency_ghz = 1.35
rvv_stripmine_overhead_cycles = 0
preprocess_elements = 33554432
preprocess_ops_per_element = 1
dma_double_buffering = 0
