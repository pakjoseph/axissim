# Illustrative sensitivity scenario. These values are not measurements from
# Velaura, Ara, a process design kit, a package, or deployed silicon.
scenario_name = implementation_proxy_sensitivity
model_version = 0.2
include = ../baseline/workload.conf
include = ../baseline/architecture.conf
include = ../baseline/implementation.conf
include = ../baseline/energy.conf

# Modeled capacity/static power and facility assumptions.
static_power_w = 0.05
npu_static_power_per_mac_w = 0.00003
rvv_static_power_per_lane_w = 0.002
sram_static_power_per_kib_w = 0.0001
dram_interface_static_power_w = 0.02
it_power_budget_w = 0.23
pue = 1.5

# Straight-line deployment electricity sensitivity: 100,000 devices for three
# 365-day years at an illustrative $0.10/kWh.
deployment_xpu_count = 100000
deployment_hours = 26280
electricity_cost_per_kwh = 0.10

# Architecture area coefficient proxy. This is not a floorplan or GDS estimate.
base_area_mm2 = 10
npu_area_per_mac_mm2 = 0.005
rvv_area_per_lane_mm2 = 0.10
sram_area_per_kib_mm2 = 0.01
max_area_mm2 = 20

# Single-node first-order RC thermal sensitivity. These are assumed package-level
# coefficients, not characterized values or thermal signoff inputs.
ambient_temp_c = 25
thermal_resistance_c_per_w = 20
thermal_capacitance_j_per_c = 1
max_junction_temp_c = 85

# FIT extrapolation sensitivity. FIT and multiplier are user assumptions; AxisSim
# does not derive either from voltage, process, soft errors, ECC, aging, or yield.
reliability_fit_rate = 100
reliability_voltage_fit_multiplier = 1.5
