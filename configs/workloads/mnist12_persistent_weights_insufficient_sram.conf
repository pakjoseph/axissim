# Deliberately infeasible mapping-policy fixture. The two named persistent
# NPU weight tensors require 13,600 B, but the dedicated store is only 8 KiB.
# AxisSim must reject this before scheduling a frame; it is a guardrail, not a
# performance-study candidate.
scenario_name = mnist12_persistent_weights_rejected_8k_sram
model_version = 0.3
workload_mode = profiled_graph
workload_profile = ../../reference_data/workloads/mnist12_profile.json
mapping_plan = ../mappings/mnist12_persistent_weights.json
frames = 30
frame_period_us = 33333
deadline_us = 33333
rvv_vlen_bits = 256
rvv_sew_bits = 32
rvv_lmul = 1
rvv_lanes = 8
rvv_ops_per_lane_cycle = 1
npu_macs = 1024
npu_tile_m = 64
npu_tile_n = 64
npu_tile_k = 128
npu_element_bytes = 2
npu_accumulator_bytes = 4
sram_capacity_bytes = 131072
npu_weights_resident = 0
weight_sram_capacity_bytes = 8192
dma_double_buffering = 1
include = ../baseline/implementation.conf
include = ../baseline/energy.conf
