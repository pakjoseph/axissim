# Analytical residency study: two NPU weight tensors remain resident after frame 0.
# The named plan must fit the explicit dedicated weight-SRAM capacity below.
scenario_name = mnist12_persistent_weights
model_version = 0.3
workload_mode = profiled_graph
workload_profile = ../../reference_data/workloads/mnist12_profile.json
mapping_plan = ../mappings/mnist12_persistent_weights.json
frames = 30
frame_period_us = 33333
deadline_us = 33333
# Architecture copy with a dedicated 16 KiB model-weight SRAM. This avoids a
# silent override of the baseline's explicitly disabled residency setting.
rvv_vlen_bits = 256
rvv_sew_bits = 32
rvv_lmul = 1
rvv_lanes = 8
rvv_ops_per_lane_cycle = 1
npu_macs = 1024
npu_tile_m = 64
npu_tile_n = 64
npu_tile_k = 128
npu_element_bytes = 2
npu_accumulator_bytes = 4
sram_capacity_bytes = 131072
npu_weights_resident = 0
weight_sram_capacity_bytes = 16384
dma_double_buffering = 1
include = ../baseline/implementation.conf
include = ../baseline/energy.conf
